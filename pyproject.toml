[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akd"
version = "0.2.0"
description = "Auto Kernel Dispatcher: benchmark-driven dispatch across hand-written Triton kernel variants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "akd developers" }]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
triton = ["triton>=3.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/akd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
